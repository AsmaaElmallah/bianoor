name: bayanour
description: "Bayanour - Educational app for infants (Duolingo-style for babies)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.5.1
  go_router: ^14.6.2
  video_player: ^2.9.2
  chewie: ^1.8.5
  intl: ^0.20.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.3
  flutter_svg: ^2.0.10+1
  material_symbols_icons: ^4.2801.0
  just_audio: ^0.9.46
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/videos/
    - assets/images/
    - assets/icons/
    - assets/audio/
    - assets/math/
    - assets/visual/
    - assets/emotional/
  fonts:
    - family: XPNiloofar
      fonts:
        - asset: ../Niloofar/XB Niloofar.ttf
          weight: 400
        - asset: ../Niloofar/XB NiloofarBd.ttf
          weight: 700
        - asset: ../Niloofar/XB NiloofarIt.ttf
          weight: 400
          style: italic
