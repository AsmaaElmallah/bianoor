org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
# مشروع على E: والـ Pub cache على C: — يمنع فشل Kotlin incremental
kotlin.incremental=false
# مشروع assets ضخم — يقلل ضغط AAPT2/Gradle
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.daemon=true
# مهلة إيقاف AAPT2 (ملي ثانية) — الافتراضي 30 ثانية
android.aapt2.daemon.shutdownTimeout=600000
